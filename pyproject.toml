[project]
name = "marketdash"
version = "0.1.0"
description = "5-minute binary market strategy platform — architecture skeleton"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
